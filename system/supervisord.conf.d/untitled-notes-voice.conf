[program:untitled-notes-voice]
command=python3 system/services/oom_priority/bin/oom_tag_service.py user bash -c "python3 system/scripts/forward_port.py --manifest system/apps/untitled_notes_voice/app.toml --url http://localhost:8096 && exec uv run --package untitled-notes-voice untitled-notes-voice"
directory=/home/user/workspace
autostart=true
autorestart=true
startsecs=5
startretries=5
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/untitled-notes-voice-stdout.log
stderr_logfile=/var/log/supervisor/untitled-notes-voice-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
