<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Untitled</title>
  <!-- pwa head -->
  <style>
    :root { font-family: ui-sans-serif, system-ui, sans-serif; color: #343a33; background: #faf9f5; }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 300px; }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 1px solid #778b78; outline-offset: 3px; }
    .update-notice { position: sticky; top: 0; z-index: 40; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 4px 12px; padding: calc(6px + env(safe-area-inset-top)) 16px 6px; border-bottom: 1px solid #b7c4b6; background: #edf1e8; color: #344b37; font-size: 13px; }
    .mirror-notice { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 4px 12px; padding: calc(6px + env(safe-area-inset-top)) 16px 6px; border-bottom: 1px solid #e5e8e0; background: #f3f2ec; color: #5d6a5c; font-size: 13px; text-align: center; }
    .mirror-notice a { min-height: 44px; display: inline-flex; align-items: center; color: #435f47; font-weight: 650; }
    /* A view-only copy (the notes live on another machine) offers nothing that writes or sends. */
    body.mirror .new-draft-button, body.mirror .trash-button, body.mirror #continue-button, body.mirror #voice-button,
    body.mirror #resend-button, body.mirror #remove-fired-button, body.mirror #save-indicator { display: none !important; }
    .update-notice button { min-height: 44px; border: 1px solid #b7c4b6; border-radius: 4px; padding: 8px 12px; color: #344b37; background: #faf9f5; }
    .app { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; padding: 27px clamp(24px, 5vw, 42px) 0; }
    .view { flex: 1; display: flex; flex-direction: column; min-height: 0; }
    .view[hidden], [hidden] { display: none !important; }
    .header { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
    .header-actions { display: flex; align-items: center; gap: 4px; flex: none; }
    .title { width: 100%; min-width: 0; border: 0; padding: 0; background: transparent; color: #455144; font-family: Georgia, 'Iowan Old Style', serif; font-size: 27px; letter-spacing: -.045em; }
    .title::placeholder { color: #a7b1a4; opacity: 1; }
    .icon-button { display: inline-grid; place-items: center; width: 48px; height: 48px; flex: none; border: 0; padding: 0; background: transparent; color: #7e907e; }
    .icon-button:hover { color: #344b37; }
    .icon-button svg { display: block; width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.45; stroke-linecap: round; stroke-linejoin: round; }
    #draft-text { flex: 1; width: 100%; min-height: 240px; margin-top: 34px; border: 0; padding: 0; resize: none; outline: none; background: transparent; color: #343a33; font-family: Georgia, 'Iowan Old Style', serif; font-size: clamp(19px, 2.6vw, 22px); line-height: 1.62; letter-spacing: -.016em; }
    .editor-footer { display: flex; align-items: center; justify-content: space-between; min-height: 44px; border-top: 1px solid #e5e8e0; }
    /* The controls at the bottom of each view stay pinned to the visible bottom edge (above the
       browser's toolbar and the keyboard) however long the text above them grows. */
    .editor-bottom, .setup-footer, .list-footer { position: sticky; bottom: 0; z-index: 3; background: #faf9f5; padding-bottom: calc(14px + env(safe-area-inset-bottom)); }
    .editor-bottom { padding-top: 8px; }
    .save-indicator { width: 32px; height: 32px; display: inline-grid; place-items: center; color: #8b9c8a; opacity: 0; transition: opacity .25s; }
    .save-indicator.visible { opacity: 1; }
    .save-indicator.error { color: #aa625b; opacity: 1; }
    .save-indicator svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
    .section-heading { margin: 58px 0 25px; color: #445144; font-family: Georgia, 'Iowan Old Style', serif; font-size: 31px; font-weight: 400; letter-spacing: -.045em; }
    .draft-list { display: flex; flex-direction: column; }
    .draft-row { display: flex; width: 100%; align-items: baseline; justify-content: space-between; gap: 14px; border: 0; border-bottom: 1px solid #e5e8e0; padding: 16px 0; background: transparent; text-align: left; }
    .draft-row:first-child { border-top: 1px solid #e5e8e0; }
    .draft-row:hover .draft-name { color: #809781; }
    .draft-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #495448; font-family: Georgia, 'Iowan Old Style', serif; font-size: 18px; }
    .draft-date { flex: none; color: #a9b0a5; font-size: 10px; }
    .list-switcher { display: flex; gap: 8px; margin: 48px 0 24px; }
    .list-switcher .icon-button { width: 48px; height: 48px; color: #aab6a8; }
    .list-switcher .icon-button.active { color: #4c6951; border-bottom: 1px solid #819982; }
    .fired-status { display: inline-grid; place-items: center; width: 20px; height: 20px; flex: none; }
    .fired-status svg { display: block; width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.65; stroke-linecap: round; stroke-linejoin: round; }
    .fired-status.sending, .fired-status.checking { color: #b49a5d; }
    .fired-status.attention { color: #bd756d; }
    .fired-status.attention svg { fill: currentColor; stroke: none; }
    .fired-row { align-items: center; }
    .fired-text { display: flex; flex: 1; flex-direction: column; gap: 3px; min-width: 0; }
    /* A phone has no hover, so what the status icon means is spelled out under the note's name. */
    .fired-caption { display: none; color: #98a595; font-size: 12px; line-height: 1.4; }
    .fired-caption .state { font-weight: 600; }
    .fired-caption.sending .state, .fired-caption.checking .state { color: #9a8240; }
    .fired-caption.attention .state { color: #a9625a; }
    @media (hover: none), (pointer: coarse) { .fired-caption { display: block; } }
    /* Hints: a short label and one line of explanation for every icon (hover, keyboard focus, or press and hold). */
    .tip { position: fixed; z-index: 30; max-width: min(300px, calc(100vw - 16px)); border: 1px solid #e4e8df; padding: 8px 11px; background: #faf9f5; box-shadow: 0 5px 16px #35433318; color: #8b9989; font-size: 12px; line-height: 1.45; pointer-events: none; }
    .tip b { display: block; color: #344b37; font-weight: 600; }
    [data-tip] { -webkit-touch-callout: none; }
    .fired-row, .icon-button, .fired-status { -webkit-user-select: none; user-select: none; }
    .save-indicator:not(.visible) { pointer-events: none; }
    .fired-info { display: flex; flex-direction: column; gap: 6px; margin: 22px 0 0; color: #8b9989; font-size: 12px; line-height: 1.5; }
    .fired-info p { margin: 0; }
    .fired-info .state b { color: #6f7f6f; font-weight: 600; }
    .fired-info .problem { color: #9a5a54; }
    .fired-info .id-line { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
    .fired-info .id-chip { min-height: 32px; border: 1px solid #e4e8df; padding: 4px 8px; background: transparent; color: #5b6b5b; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; text-align: left; overflow-wrap: anywhere; -webkit-user-select: text; user-select: text; }
    .fired-info .id-chip:hover { border-color: #b7c4b6; color: #344b37; }
    .fired-info .copied { color: #627b65; }
    @media (pointer: coarse) { .fired-info .id-chip { min-height: 44px; } }
    .fired-info:not([hidden]) + #draft-text { margin-top: 18px; }
    .readonly-indicator { display: inline-grid; place-items: center; width: 32px; height: 32px; }
    .readonly-indicator[hidden] { display: none; }
    .empty-list { margin: 0; color: #a5afa1; font-family: Georgia, 'Iowan Old Style', serif; font-style: italic; }
    .list-footer { display: flex; justify-content: flex-end; margin-top: auto; padding-top: 20px; }
    .choice-list { display: flex; flex-direction: column; }
    .choice { display: flex; align-items: center; gap: 12px; width: 100%; border: 0; border-bottom: 1px solid #e5e8e0; padding: 17px 0; background: transparent; text-align: left; color: #556154; font-family: Georgia, 'Iowan Old Style', serif; font-size: 17px; }
    .choice:first-child { border-top: 1px solid #e5e8e0; }
    .choice-circle { width: 12px; height: 12px; border: 1px solid #abb6a9; border-radius: 50%; }
    .choice.active .choice-circle { border-color: #627b65; background: #627b65; box-shadow: inset 0 0 0 3px #faf9f5; }
    .choice.active { color: #314734; }
    .fields { margin-top: 28px; }
    #machine-fields + .fields { margin-top: 0; }
    .field { display: flex; align-items: center; min-height: 46px; gap: 12px; border-bottom: 1px solid #e5e8e0; }
    .field label { width: 79px; flex: none; color: #8b9989; font-size: 11px; }
    .field input, .field select { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: #435144; font-size: 16px; min-height: 48px; }
    .field input::placeholder { color: #acb5aa; }
    .field .icon-button { width: 48px; height: 48px; }
    .field .icon-button svg { width: 17px; height: 17px; }
    .field .icon-button:disabled { color: #bdc6b9; cursor: default; }
    .setup-footer { display: flex; align-items: center; justify-content: space-between; gap: 15px; margin-top: auto; padding-top: 28px; }
    .setup-note { color: #a4ada2; font-size: 11px; }
    .action { min-width: 64px; min-height: 48px; border: 0; padding: 12px 16px; background: transparent; color: #435f47; font-size: 16px; font-weight: 650; }
    .action:hover { color: #233b27; }
    .action:disabled { color: #a8b2a6; cursor: default; }
    button { touch-action: manipulation; }
    .draft-entry { display: flex; align-items: center; border-bottom: 1px solid #e5e8e0; }
    .draft-entry:first-child { border-top: 1px solid #e5e8e0; }
    .draft-entry .draft-row { min-width: 0; min-height: 56px; border: 0; }
    .trash-button:hover { color: #aa625b; }
    .empty-outbox { display: grid; place-items: center; min-height: 240px; color: #9aaa94; }
    .empty-outbox svg { width: 80px; height: 80px; fill: none; stroke: currentColor; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }
    .list-error { color: #aa625b; font-size: 13px; }
    .footer-actions { display: flex; align-items: center; gap: 4px; }
    .voice-button { position: relative; border-radius: 50%; -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; }
    .voice-button::before { content: ''; position: absolute; inset: 6px; border-radius: 50%; background: #b4473f; opacity: 0; transform: scale(calc(.75 + var(--level, 0) * .6)); transition: transform .08s linear, opacity .2s; }
    .voice-button svg { position: relative; }
    .voice-button.listening { color: #faf9f5; }
    .voice-button.listening:hover { color: #faf9f5; }
    .voice-button.listening::before { opacity: 1; }
    /* A steady pulse while recording, so it reads as live even when the room is quiet
       (or the engine reports no loudness). */
    .voice-button::after { content: ''; position: absolute; inset: 6px; border-radius: 50%; border: 2px solid #b4473f; opacity: 0; pointer-events: none; }
    .voice-button.listening::after { animation: voice-live 1.6s ease-out infinite; }
    @keyframes voice-live { 0% { transform: scale(.9); opacity: .55; } 100% { transform: scale(1.35); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .voice-button.listening::after { animation: none; opacity: .4; transform: scale(1.15); } }
    .voice-button.starting { color: #b4473f; animation: voice-wait 1.2s ease-in-out infinite; }
    @keyframes voice-wait { 50% { opacity: .35; } }
    .voice-caption { min-height: 0; margin: 0 0 10px; color: #556154; font-family: Georgia, 'Iowan Old Style', serif; font-size: 17px; line-height: 1.5; }
    .voice-caption:empty { display: none; }
    .voice-caption .tentative { color: #a7b1a4; }
    .voice-caption .voice-status { color: #a4ada2; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 12px; }
    .editor-bottom { position: sticky; }
    .voice-menu { position: absolute; right: 0; bottom: calc(100% - 4px); z-index: 5; width: min(300px, calc(100vw - 32px)); border: 1px solid #e4e8df; padding: 6px 0; background: #faf9f5; box-shadow: 0 8px 24px #35433322; }
    .voice-menu h2 { margin: 6px 14px 4px; color: #8b9989; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
    .voice-menu button { display: flex; width: 100%; min-height: 48px; align-items: center; gap: 10px; border: 0; padding: 6px 14px; background: transparent; color: #435144; font-size: 15px; text-align: left; }
    .voice-menu button:hover { background: #f0f1ea; }
    .voice-menu button:disabled { color: #b4bcb1; cursor: default; background: transparent; }
    .voice-menu .choice-circle { flex: none; }
    .voice-menu button[aria-checked="true"] .choice-circle { border-color: #627b65; background: #627b65; box-shadow: inset 0 0 0 3px #faf9f5; }
    .voice-menu .model-name { flex: 1; }
    .voice-menu .model-detail { display: block; color: #9aa596; font-size: 11px; }
    .voice-menu .model-size { flex: none; color: #9aa596; font-size: 12px; }
    .voice-menu p { margin: 4px 14px 6px; color: #9aa596; font-size: 11px; line-height: 1.4; }
    .voice-notice { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; margin: 0 0 10px; color: #8b5a55; font-size: 13px; line-height: 1.45; }
    .voice-notice a, .voice-notice button { min-height: 48px; display: inline-flex; align-items: center; border: 0; padding: 0 4px; background: transparent; color: #435f47; font-size: 14px; font-weight: 650; text-decoration: none; }
    @media (max-width: 420px) { .app { padding: 20px 16px 0; } .header { gap: 4px; } .header-actions { gap: 0; } .title { font-size: 24px; } }
    @media (max-height: 640px) { .section-heading { margin-top: 34px; } .fields { margin-top: 18px; } .field { min-height: 48px; } #draft-text { min-height: 96px; margin-top: 16px; } }
  </style>
</head>
<body>
  <!-- mirror notice -->
  <aside id="update-notice" class="update-notice" aria-label="App update" hidden>
    <span id="update-message" role="status">An update is ready.</span>
    <button id="refresh-app" type="button">Click here to refresh</button>
  </aside>
  <main class="app">
    <section class="view" id="editor-view" aria-label="Draft editor">
      <header class="header">
        <input class="title" id="draft-title" aria-label="Draft title" placeholder="Untitled" maxlength="120" autocomplete="off" spellcheck="true">
        <div class="header-actions">
          <button class="icon-button new-draft-button" type="button" aria-label="New draft" data-tip="New draft" data-tip-more="Start a blank note."><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4.5v15M4.5 12h15"/></svg></button>
          <button class="icon-button" id="drafts-button" type="button" aria-label="Drafts" data-tip="Drafts" data-tip-more="Notes you are still writing."><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5.5h11.5v13H7zM5 8H3.5v12.5H16"/></svg></button>
          <button class="icon-button" id="fired-button" type="button" aria-label="Fired" data-tip="Fired" data-tip-more="Notes you have sent, and whether each one arrived."><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="6" width="17" height="12" rx="1.5"/><path d="m4.5 7 7.5 6 7.5-6"/></svg></button>
        </div>
      </header>
      <div class="fired-info" id="fired-info" hidden></div>
      <textarea id="draft-text" aria-label="Draft text" spellcheck="true"></textarea>
      <div class="editor-bottom">
      <div class="voice-menu" id="voice-menu" role="menu" aria-label="Speech model" hidden></div>
      <p class="voice-caption" id="voice-caption" aria-live="polite"></p>
      <div class="voice-notice" id="voice-notice" role="alert" hidden><span id="voice-notice-text"></span><a id="voice-open-tab" href="/" target="_blank" rel="noopener" hidden>Open in its own tab</a><button id="voice-notice-close" type="button" aria-label="Dismiss">Dismiss</button></div>
      <footer class="editor-footer">
        <span class="save-indicator" id="save-indicator" aria-live="polite" aria-label=""><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8 12 2.6 2.8L16 9"/></svg></span>
        <span class="fired-status readonly-indicator" id="readonly-status" role="img" hidden></span>
        <div class="footer-actions">
          <button class="icon-button voice-button" id="voice-button" type="button" aria-label="Start dictation" aria-pressed="false" aria-haspopup="menu" data-tip="Dictate" data-tip-more="Tap to start talking. Right-click or hold to pick a speech model." data-tip-hold="own"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3.5" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v2.5"/></svg></button>
          <button class="icon-button" id="continue-button" type="button" aria-label="Continue" data-tip="Continue" data-tip-more="Choose where to send this note."><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 12h14M13 6.5l5.5 5.5-5.5 5.5"/></svg></button>
          <button class="icon-button" id="resend-button" type="button" aria-label="Resend" data-tip="Resend" data-tip-more="Send again as a new message. The original stays until this attempt is confirmed." hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2 6M20 4v7h-7"/></svg></button>
          <button class="icon-button trash-button" id="remove-fired-button" type="button" aria-label="Remove from Fired" data-tip="Remove from Fired" data-tip-more="Take this off the list. Copy its text first if you still need it." hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 10v7M14 10v7"/></svg></button>
          <button class="icon-button" id="copy-button" type="button" aria-label="Copy text" data-tip="Copy text" data-tip-more="Copy this sent note to the clipboard." hidden><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="11" height="12" rx="1.5"/><path d="M15.5 8V5.5A1.5 1.5 0 0 0 14 4H6a1.5 1.5 0 0 0-1.5 1.5V15A1.5 1.5 0 0 0 6 16.5h2"/></svg></button>
        </div>
      </footer>
      </div>
    </section>
    <section class="view" id="drafts-view" aria-label="Drafts" hidden>
      <header class="header"><button class="icon-button back-button" type="button" aria-label="Back to editor" data-tip="Back" data-tip-more="Return to your note. Shortcut: Esc."><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 12h-14M11 6.5 5.5 12l5.5 5.5"/></svg></button></header>
      <nav class="list-switcher" aria-label="Notes"><button class="icon-button active" id="list-drafts" type="button" aria-label="Drafts" data-tip="Drafts" data-tip-more="Notes you are still writing."><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5.5h11.5v13H7zM5 8H3.5v12.5H16"/></svg></button><button class="icon-button" id="list-fired" type="button" aria-label="Fired" data-tip="Fired" data-tip-more="Notes you have sent, and whether each one arrived."><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="6" width="17" height="12" rx="1.5"/><path d="m4.5 7 7.5 6 7.5-6"/></svg></button></nav>
      <div class="draft-list" id="draft-list"></div>
      <p id="list-error" class="list-error" role="alert" hidden></p>
      <div class="list-footer"><button class="icon-button new-draft-button" type="button" aria-label="New draft" data-tip="New draft" data-tip-more="Start a blank note."><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4.5v15M4.5 12h15"/></svg></button></div>
    </section>
    <section class="view" id="setup-view" aria-label="Choose destination" hidden>
      <header class="header"><button class="icon-button back-button" type="button" aria-label="Back to editor" data-tip="Back" data-tip-more="Return to your note. Shortcut: Esc."><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 12h-14M11 6.5 5.5 12l5.5 5.5"/></svg></button></header>
      <h1 class="section-heading">Destination</h1>
      <div class="choice-list">
        <button class="choice active" id="new-chat" type="button" aria-pressed="true"><span class="choice-circle" aria-hidden="true"></span>New chat</button>
        <button class="choice" id="follow-up" type="button" aria-pressed="false"><span class="choice-circle" aria-hidden="true"></span>Follow-up</button>
      </div>
      <div class="fields" id="machine-fields">
        <div class="field"><label for="machine">Machine</label><select id="machine"><option value="">Loading machines…</option></select><button class="icon-button" id="refresh-machines" type="button" aria-label="Refresh linked machines" data-tip="Refresh linked machines" data-tip-more="Reload the machines and chats you can send to."><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.7-4.3M4 4v4.5h4.5M4 13a8 8 0 0 0 14.7 4.3M20 20v-4.5h-4.5"/></svg></button></div>
      </div>
      <div class="fields" id="new-chat-fields">
        <div class="field"><label for="chat-name">Chat name</label><input id="chat-name" type="text" placeholder="&lt;default&gt;" autocomplete="off"></div>
        <div class="field"><label for="provider">Provider</label><select id="provider"><option value="claude">Claude</option><option value="codex">Codex</option><option value="agy">Agy</option><option value="pi-dev">Pi-dev</option></select></div>
        <div class="field" id="subscription-field" hidden><label for="subscription">Subscription</label><select id="subscription"><option value="">Loading subscriptions…</option></select></div>
        <div class="field"><label for="model">Model</label><select id="model"><option value="">Loading models…</option></select></div>
        <div class="field"><label for="effort">Effort</label><select id="effort"><option value="">Choose model first</option></select></div>
      </div>
      <div class="fields" id="followup-fields" hidden><div class="field"><label for="target-chat">Chat</label><select id="target-chat"><option value="">Loading chats…</option></select></div></div>
      <footer class="setup-footer"><span class="setup-note" id="setup-note"></span><button class="action" id="preview-button" type="button" data-tip="Send" data-tip-more="Send this note to the place chosen above.">Send</button></footer>
    </section>
  </main>
  <div class="tip" id="tip" role="tooltip" hidden></div>
  <script src="/voice/voice_session.js?v=__FRONTEND_VERSION__"></script>
  <script src="/voice/voice_capture.js?v=__FRONTEND_VERSION__"></script>
  <script src="/voice/voice_streaming.js?v=__FRONTEND_VERSION__"></script>
  <!-- selector bootstrap -->
  <script>
    // The server adds the notice only on a view-only copy of another machine's notes.
    const MIRROR = Boolean(document.getElementById('mirror-notice'));
    if (MIRROR) document.body.classList.add('mirror');
    const delay = ms => new Promise(resolve => setTimeout(resolve, ms));
    const views = {
      editor: document.getElementById('editor-view'),
      drafts: document.getElementById('drafts-view'),
      setup: document.getElementById('setup-view')
    };
    const titleInput = document.getElementById('draft-title');
    const bodyInput = document.getElementById('draft-text');
    const indicator = document.getElementById('save-indicator');
    const list = document.getElementById('draft-list');
    const SAVE_DELAY_MS = 1600;
    let drafts = [];
    let currentKey = null;
    let timer = null;
    let saving = false;
    let savedTimer = null;
    let activeView = 'editor';
    let hasInteracted = false;
    let fired = [];
    let firedLoaded = false;
    let currentFired = null;
    let listMode = 'drafts';
    const providerInput = document.getElementById('provider');
    const machineInput = document.getElementById('machine');
    const refreshMachinesButton = document.getElementById('refresh-machines');
    const modelInput = document.getElementById('model');
    const subscriptionField = document.getElementById('subscription-field');
    const subscriptionInput = document.getElementById('subscription');
    // pi-dev's subscriptions (one per pi account on the machine) from the last model answer; empty for other providers.
    let subscriptions = [];
    const effortInput = document.getElementById('effort');
    const chatNameInput = document.getElementById('chat-name');
    const targetChatInput = document.getElementById('target-chat');
    const serverChoices = JSON.parse(document.getElementById("selector-bootstrap")?.textContent || "{}");
    function normalizeDefaults(value) {
      const result = structuredClone(value);
      if (!result.by_machine) {
        const machine = result.machine || serverChoices.machines?.current_machine_id || '';
        result.by_machine = {};
        if (machine) {
          result.machine = machine;
          result.by_machine[machine] = { provider: result.provider || 'claude', by_provider: result.by_provider || {} };
        }
      }
      for (const machine of Object.values(result.by_machine)) {
        for (const provider of Object.values(machine.by_provider || {})) {
          if (!provider.by_subscription) {
            const remembered = { ...(provider.model_by_subscription || {}) };
            if (provider.subscription && provider.model && !remembered[provider.subscription]) remembered[provider.subscription] = provider.model;
            provider.by_subscription = {};
            for (const [subscription, model] of Object.entries(remembered)) {
              provider.by_subscription[subscription] = { model, effort_by_model: { ...(provider.effort_by_model || {}) } };
            }
          }
        }
      }
      result.version = 2;
      return result;
    }
    let defaults = normalizeDefaults({ provider: 'claude', by_provider: {} });
    const DEFAULTS_KEY = 'prompt-notes.defaults.v2';
    let defaultsChanged = false;
    let localDefaultsReady = false;
    try {
      const cached = JSON.parse(localStorage.getItem(DEFAULTS_KEY) ||
        (!serverChoices.defaults && localStorage.getItem('prompt-notes.defaults.v1')) || 'null');
      if (cached && [...providerInput.options].some(option => option.value === cached.provider) && cached.by_provider) {
        defaults = normalizeDefaults(cached); providerInput.value = defaults.provider; localDefaultsReady = true;
      }
    } catch (_) {}
    if (serverChoices.defaults) {
      defaults = normalizeDefaults(serverChoices.defaults);
      providerInput.value = defaults.provider;
      localDefaultsReady = true;
    }
    let defaultsReady = Promise.resolve();
    let defaultsWrite = Promise.resolve();
    let models = [];
    let modelRequest = 0;
    const MODEL_CACHE_KEY = 'prompt-notes.models.v3';
    const MODEL_CACHE_MAX_AGE = 24 * 60 * 60 * 1000;
    const modelCache = new Map();
    const modelFetches = new Map();
    try {
      const cached = JSON.parse(localStorage.getItem(MODEL_CACHE_KEY) || '{}');
      for (const [key, entry] of Object.entries(cached)) {
        if (entry && Date.now() - entry.savedAt < MODEL_CACHE_MAX_AGE && validModels(entry.data)) {
          modelCache.set(key, entry);
        }
      }
    } catch (_) { /* Storage can be disabled or hold an older format. */ }
    // Server choices survive a new browser, expired storage, and machine switches.
    for (const [key, entry] of Object.entries(serverChoices.catalogs || {})) {
      if (validModels(entry.data)) modelCache.set(key, entry);
    }
    function validModels(data) {
      return data && Array.isArray(data.models) && data.models.every(model =>
        typeof model.id === 'string' && typeof model.label === 'string' && Array.isArray(model.efforts));
    }
    function modelMachine() { return machineInput.value || defaults.machine || ''; }
    function modelKey(provider, machine = modelMachine()) { return `${machine}:${provider}`; }
    function fetchModels(provider, machine = modelMachine()) {
      const key = modelKey(provider, machine);
      if (modelFetches.has(key)) return modelFetches.get(key);
      const pending = api(`/api/chat-models/${encodeURIComponent(provider)}?machine=${encodeURIComponent(machine)}`).then(data => {
        if (!validModels(data)) throw new Error('Invalid model choices');
        modelCache.set(key, { savedAt: Date.now(), data });
        try { localStorage.setItem(MODEL_CACHE_KEY, JSON.stringify(Object.fromEntries(modelCache))); } catch (_) {}
        return data;
      }).finally(() => modelFetches.delete(key));
      modelFetches.set(key, pending);
      return pending;
    }
    function warmModels() {
      if (MIRROR) return;
      for (const option of providerInput.options) {
        const provider = option.value;
        const machine = modelMachine();
        fetchModels(provider, machine).then(data => {
          if (modelMachine() === machine && providerInput.value === provider && activeView === 'setup') applyModels(data);
        }).catch(() => {});
      }
    }
    let chatNameEdited = false;
    let machinesLoaded = false;

    // ---- Hints: any element with data-tip (and optionally data-tip-more) explains itself ----
    // A mouse hovers (after a short pause), the keyboard focuses, and a finger presses and holds.
    // The microphone keeps its own press-and-hold menu, so it opts out with data-tip-hold="own".
    const tipBox = document.getElementById('tip');
    let tipTarget = null, tipPending = null, tipTimer = null, pressTimer = null, suppressClick = false;
    let pointerSpot = null;
    function tipOf(node) { return node instanceof Element ? node.closest('[data-tip]') : null; }
    function showTip(target, spot) {
      clearTimeout(tipTimer);
      tipTarget = target; tipPending = null;
      tipBox.replaceChildren();
      const label = document.createElement('b'); label.textContent = target.dataset.tip; tipBox.append(label);
      if (target.dataset.tipMore) tipBox.append(document.createTextNode(target.dataset.tipMore));
      tipBox.hidden = false;
      const box = target.getBoundingClientRect();
      const width = tipBox.offsetWidth, height = tipBox.offsetHeight, margin = 8;
      // A wide target (a list row) is explained next to the pointer; an icon is explained next to itself.
      const wide = box.width > 160 && spot;
      const centerX = wide ? spot.x : box.left + box.width / 2;
      const upper = (wide ? spot.y : box.top + box.height / 2) < window.innerHeight / 2;
      const edge = wide ? spot.y : (upper ? box.bottom : box.top);
      const gap = wide ? 16 : 6;
      const top = Math.min(Math.max(margin, upper ? edge + gap : edge - height - gap), window.innerHeight - height - margin);
      const left = Math.min(Math.max(margin, centerX - width / 2), window.innerWidth - width - margin);
      tipBox.style.top = `${top}px`; tipBox.style.left = `${left}px`;
    }
    function hideTip() { clearTimeout(tipTimer); tipTarget = tipPending = null; tipBox.hidden = true; }
    document.addEventListener('pointerover', event => {
      if (event.pointerType !== 'mouse') return;
      const target = tipOf(event.target);
      if (target === (tipTarget || tipPending)) return;
      hideTip();
      pointerSpot = { x: event.clientX, y: event.clientY };
      if (target) { tipPending = target; tipTimer = setTimeout(() => showTip(target, pointerSpot), 200); }
    });
    document.addEventListener('pointermove', event => { if (event.pointerType === 'mouse') pointerSpot = { x: event.clientX, y: event.clientY }; });
    document.addEventListener('pointerdown', event => {
      hideTip();
      clearTimeout(pressTimer);
      suppressClick = false;
      if (event.pointerType === 'mouse') return;
      const target = tipOf(event.target);
      if (!target || target.dataset.tipHold === 'own') return;
      const spot = { x: event.clientX, y: event.clientY };
      pressTimer = setTimeout(() => {
        suppressClick = true;   // the tap that ends this hold must not also press the button
        showTip(target, spot);
        tipTimer = setTimeout(hideTip, 4000);
      }, 450);
    });
    for (const type of ['pointerup', 'pointercancel']) document.addEventListener(type, () => {
      clearTimeout(pressTimer);
      // The click that ends a hold comes at once; if none does, stop waiting for it.
      if (suppressClick) setTimeout(() => { suppressClick = false; }, 400);
    });
    document.addEventListener('click', event => {
      if (!suppressClick) return;
      suppressClick = false;
      event.preventDefault(); event.stopPropagation();
    }, true);
    document.addEventListener('focusin', event => {
      const target = tipOf(event.target);
      if (target && event.target.matches(':focus-visible')) showTip(target);
    });
    document.addEventListener('focusout', hideTip);
    document.addEventListener('keydown', event => { if (event.key === 'Escape') hideTip(); });
    window.addEventListener('scroll', hideTip, true);
    async function copyText(text) {
      try { await navigator.clipboard.writeText(text); return true; } catch (_) { /* Not a secure page: fall back. */ }
      const area = document.createElement('textarea');
      area.value = text; area.setAttribute('readonly', ''); area.style.cssText = 'position:fixed;top:0;left:-9999px';
      document.body.append(area); area.select();
      let copied = false;
      try { copied = document.execCommand('copy'); } catch (_) {}
      area.remove();
      return copied;
    }
    function setTip(node, label, more = '') {
      node.dataset.tip = label;
      if (more) node.dataset.tipMore = more; else delete node.dataset.tipMore;
    }

    function show(name) {
      hideTip();
      if (name !== 'editor') stopVoice();
      activeView = name;
      for (const [key, node] of Object.entries(views)) node.hidden = key !== name;
      if (name === 'editor') bodyInput.focus();
    }
    function hideIndicator() {
      clearTimeout(savedTimer);
      indicator.classList.remove('visible', 'error');
      indicator.setAttribute('aria-label', '');
      delete indicator.dataset.tip; delete indicator.dataset.tipMore;
    }
    function showSaved() {
      indicator.classList.remove('error');
      indicator.classList.add('visible');
      indicator.setAttribute('aria-label', 'Saved');
      setTip(indicator, 'Saved', 'Your latest changes are stored.');
      clearTimeout(savedTimer);
      savedTimer = setTimeout(hideIndicator, 1800);
    }
    function showSaveError() {
      indicator.classList.add('error');
      indicator.classList.add('visible');
      indicator.setAttribute('aria-label', 'Could not save');
      setTip(indicator, 'Could not save', 'This note has changes that are not stored yet. Keep typing and it will try again.');
      indicator.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v6M12 17h.01"/></svg>';
    }
    function localDraft() {
      return { id: `local-${crypto.randomUUID()}`, title: '', body: '', updated_at: Date.now() / 1000, dirty: false, version: 0 };
    }
    function currentDraft() { return drafts.find(draft => draft.id === currentKey); }
    function isBlank(draft) { return !draft.title.trim() && !draft.body.trim(); }
    // A draft with no title and no text is not worth keeping once the writer has moved on from it.
    // It leaves the list at once; a copy the server already holds is deleted behind the scenes
    // (after any save under way, so that save cannot bring it back). Never a draft that dictation
    // wrote into, since a spoken turn can still land in it after the mic stops.
    function discardIfBlank(draft) {
      if (MIRROR || !draft || voiceTarget === draft || !isBlank(draft)) return;
      drafts = drafts.filter(item => item !== draft);
      if (currentKey === draft.id) currentKey = null;
      clearTimeout(timer);
      (async () => {
        try {
          while (saving) await delay(50);
          if (!draft.id.startsWith('local-')) await api(`/api/drafts/${encodeURIComponent(draft.id)}`, { method: 'DELETE' });
        } catch (_) {
          // Could not delete it on the server, so it still exists there: show it again.
          drafts.unshift(draft);
          if (activeView === 'drafts' && listMode === 'drafts') renderDrafts();
        } finally { if (drafts.some(item => item.dirty)) scheduleSave(); }
      })();
    }
    function displayDraft(draft) {
      const previous = currentDraft();
      if (previous && previous !== draft) discardIfBlank(previous);
      if (voiceTarget && voiceTarget !== draft) stopVoice();
      currentFired = null;
      currentKey = draft.id;
      titleInput.value = draft.title;
      bodyInput.value = draft.body;
      titleInput.readOnly = MIRROR;
      bodyInput.readOnly = MIRROR;
      indicator.hidden = false;
      document.getElementById('readonly-status').hidden = true;
      document.getElementById('fired-info').hidden = true;
      document.getElementById('continue-button').hidden = false;
      document.getElementById('voice-button').hidden = false;
      document.getElementById('copy-button').hidden = true;
      document.getElementById('remove-fired-button').hidden = true;
      document.getElementById('resend-button').hidden = true;
      document.title = draft.title || 'Untitled';
      chatNameInput.value = draft.title;
      chatNameEdited = false;
      hideIndicator();
      show('editor');
    }
    function statusIcon(state) {
      if (state === 'sending') return '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="6" width="17" height="12" rx="1.5"/><path d="m4.5 7 7.5 6 7.5-6"/></svg>';
      return '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7"/></svg>';
    }
    // What each state of a sent note means, in the words shown on hover, under the name on a phone, and on its page.
    const STATE_WORDS = {
      sending: { label: 'Sending', more: 'On its way to the chat. This usually takes a few seconds.', caption: 'Sending' },
      checking: { label: 'Checking', more: 'Sent, but the chat has not confirmed it yet. The app keeps checking and flags it if it cannot confirm within 6 minutes. Nothing to do yet.', caption: 'Checking: no reply yet' },
      attention: { label: 'Needs attention', more: 'Delivery could not be confirmed. Your text is safe here. Check the chat, and use Resend if it never arrived. The original stays until the retry is confirmed.', caption: 'Needs attention: not confirmed' },
    };
    function stateWords(state) { return STATE_WORDS[state] || { label: state, more: '', caption: state }; }
    function ago(seconds) {
      const diff = Math.max(0, Date.now() / 1000 - seconds);
      if (diff < 60) return 'just now';
      if (diff < 3600) return `${Math.floor(diff / 60)} min ago`;
      if (diff < 86400) return `${Math.floor(diff / 3600)} h ago`;
      return new Date(seconds * 1000).toLocaleDateString([], { month: 'short', day: 'numeric' });
    }
    function clock(seconds) {
      return new Date(seconds * 1000).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
    }
    function whereText(destination) {
      const machine = destination.machine_name || 'this machine';
      if (destination.mode === 'follow-up') return `follow-up in “${destination.chat_name || 'a chat'}” on ${machine}`;
      const settings = [destination.provider, destination.subscription_label, destination.model_label || destination.model, destination.effort].filter(Boolean).join(' ');
      return `new chat${destination.chat_name ? ` “${destination.chat_name}”` : ''} on ${machine}${settings ? ` (${settings})` : ''}`;
    }
    // The facts about a sent note, including the ID to quote when something needs debugging.
    function renderFiredInfo(action) {
      const box = document.getElementById('fired-info');
      box.replaceChildren();
      const words = stateWords(action.state);
      const add = (className, text) => { const line = document.createElement('p'); line.className = className; line.textContent = text; box.append(line); return line; };
      const state = add('state', ` ${words.more}`);
      const label = document.createElement('b'); label.textContent = `${words.label}.`; state.prepend(label);
      add('where', `Sent to ${whereText(action.destination)}`);
      if (action.error) add('problem', `Last problem: ${action.error}`);
      if (action.retry_of) add('retry', `Resent from ${action.retry_of}`);
      if (action.pending_retry_id) add('retry', 'A resend is awaiting confirmation. This original is kept until it arrives.');
      const line = add('id-line', `Fired ${clock(action.created_at)} · ID`);
      const chip = document.createElement('button'); chip.type = 'button'; chip.className = 'id-chip'; chip.textContent = action.id;
      chip.setAttribute('aria-label', `Copy ID ${action.id}`);
      setTip(chip, 'Copy ID', 'Copies this ID, to quote when something needs debugging.');
      const done = document.createElement('span'); done.className = 'copied'; done.setAttribute('aria-live', 'polite');
      chip.addEventListener('click', async () => { done.textContent = (await copyText(action.id)) ? 'Copied' : 'Could not copy; select the ID instead'; });
      line.append(chip, done);
      box.hidden = false;
    }
    function displayFired(action) {
      stopVoice();
      currentFired = action;
      titleInput.value = action.title;
      bodyInput.value = action.body;
      titleInput.readOnly = true;
      bodyInput.readOnly = true;
      document.title = action.title || 'Untitled';
      hideIndicator();
      indicator.hidden = true;
      const status = document.getElementById('readonly-status');
      status.className = `fired-status readonly-indicator ${action.state}`;
      status.innerHTML = statusIcon(action.state);
      const words = stateWords(action.state);
      status.setAttribute('aria-label', words.label);
      setTip(status, words.label, words.more);
      status.hidden = false;
      renderFiredInfo(action);
      document.getElementById('continue-button').hidden = true;
      document.getElementById('voice-button').hidden = true;
      document.getElementById('copy-button').hidden = false;
      document.getElementById('remove-fired-button').hidden = action.state === 'sending';
      const resend = document.getElementById('resend-button');
      resend.hidden = !['attention', 'checking'].includes(action.state);
      resend.disabled = Boolean(action.pending_retry_id);
      show('editor');
    }
    function scheduleSave() {
      hideIndicator();
      clearTimeout(timer);
      timer = setTimeout(saveDirty, SAVE_DELAY_MS);
    }
    function changed(field) {
      if (currentFired) return;
      const draft = currentDraft();
      if (!draft) return;
      hasInteracted = true;
      if (field === 'title') {
        draft.title = titleInput.value.trim();
        document.title = draft.title || 'Untitled';
        if (!chatNameEdited) chatNameInput.value = draft.title;
      } else draft.body = bodyInput.value;
      draft.updated_at = Date.now() / 1000;
      draft.version += 1;
      draft.dirty = true;
      scheduleSave();
    }
    async function api(path, options = {}) {
      const response = await fetch(path, { ...options, headers: { 'Content-Type': 'application/json' } });
      if (!response.ok) {
        const detail = await response.json().catch(() => ({}));
        throw new Error(detail.description || detail.detail || 'Could not save or send.');
      }
      return response.json();
    }
    async function saveDirty() {
      clearTimeout(timer);
      if (saving) return;
      saving = true;
      let failed = false;
      let savedCurrent = false;
      for (const draft of drafts.filter(item => item.dirty)) {
        const version = draft.version;
        const payload = JSON.stringify({ title: draft.title, body: draft.body });
        try {
          const isNew = draft.id.startsWith('local-');
          const saved = await api(isNew ? '/api/drafts' : `/api/drafts/${encodeURIComponent(draft.id)}`, { method: isNew ? 'POST' : 'PATCH', body: payload });
          if (isNew) { if (currentKey === draft.id) currentKey = saved.id; draft.id = saved.id; }
          if (draft.version === version) {
            draft.dirty = false;
            draft.updated_at = saved.updated_at;
            if (draft.id === currentKey) savedCurrent = true;
          }
        } catch (_) { failed = true; }
      }
      saving = false;
      if (failed) showSaveError();
      else if (savedCurrent && !drafts.some(item => item.dirty)) {
        indicator.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8 12 2.6 2.8L16 9"/></svg>';
        showSaved();
      }
      if (!failed && drafts.some(item => item.dirty)) scheduleSave();
    }
    function renderDrafts() {
      list.replaceChildren();
      document.getElementById('list-drafts').classList.toggle('active', listMode === 'drafts');
      document.getElementById('list-fired').classList.toggle('active', listMode === 'fired');
      if (listMode === 'fired') {
        if (firedLoaded && !fired.length) {
          const empty = document.createElement('div');
          empty.className = 'empty-outbox'; empty.setAttribute('role', 'img');
          empty.setAttribute('aria-label', 'Outbox empty');
          setTip(empty, 'Outbox empty', 'Nothing is waiting or stuck.');
          empty.innerHTML = '<svg viewBox="0 0 64 64" aria-hidden="true"><path d="m15 33 11 11 24-25"/></svg>';
          list.append(empty);
        }
        for (const action of fired) {
          const words = stateWords(action.state);
          const where = action.destination.machine_name || 'this machine';
          const entry = document.createElement('div'); entry.className = 'draft-entry'; entry.dataset.id = action.id;
          const row = document.createElement('button'); row.type = 'button'; row.className = 'draft-row fired-row';
          row.setAttribute('aria-label', `${action.title || 'Untitled'}, ${words.label.toLowerCase()}`);
          setTip(row, `Fired ${ago(action.created_at)}`, `To ${whereText(action.destination)}. Open it for details and its ID.`);
          const name = document.createElement('span'); name.className = 'draft-name'; name.textContent = action.title || 'Untitled';
          const caption = document.createElement('span'); caption.className = `fired-caption ${action.state}`;
          const stateText = document.createElement('span'); stateText.className = 'state'; stateText.textContent = words.caption;
          caption.append(stateText, document.createTextNode(` · ${where} · ${ago(action.created_at)}`));
          const label = document.createElement('span'); label.className = 'fired-text'; label.append(name, caption);
          const status = document.createElement('span'); status.className = `fired-status ${action.state}`; status.innerHTML = statusIcon(action.state);
          status.setAttribute('role', 'img'); status.setAttribute('aria-label', words.label);
          setTip(status, words.label, words.more);
          row.append(label, status); row.addEventListener('click', () => displayFired(action));
          entry.append(row);
          if (action.state !== 'sending') {
            const remove = document.createElement('button'); remove.type = 'button'; remove.className = 'icon-button trash-button';
            remove.setAttribute('aria-label', `Remove ${action.title || 'Untitled'} from Fired`);
            setTip(remove, 'Remove from Fired', 'Take this off the list. Copy its text first if you still need it.');
            remove.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 10v7M14 10v7"/></svg>';
            remove.addEventListener('click', async () => { remove.disabled = true; if (!(await removeFired(action))) remove.disabled = false; else renderDrafts(); });
            entry.append(remove);
          }
          list.append(entry);
        }
        return;
      }
      if (!drafts.length) { const empty = document.createElement('p'); empty.className = 'empty-list'; empty.textContent = 'No drafts yet.'; list.append(empty); return; }
      for (const draft of [...drafts].sort((a, b) => b.updated_at - a.updated_at)) {
        const row = document.createElement('button'); row.type = 'button'; row.className = 'draft-row';
        const name = document.createElement('span'); name.className = 'draft-name'; name.textContent = draft.title || 'Untitled';
        row.append(name); row.addEventListener('click', () => displayDraft(draft));
        const entry = document.createElement('div'); entry.className = 'draft-entry';
        const trash = document.createElement('button'); trash.type = 'button'; trash.className = 'icon-button trash-button';
        trash.setAttribute('aria-label', `Delete ${draft.title || 'Untitled'}`); setTip(trash, 'Delete draft', 'Permanently removes this draft.');
        trash.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 10v7M14 10v7"/></svg>';
        trash.addEventListener('click', async () => {
          if (!isBlank(draft) && !confirm(`Delete “${draft.title || 'Untitled'}”? This cannot be undone.`)) return;
          trash.disabled = true;
          const error = document.getElementById('list-error'); error.hidden = true;
          try {
            // Let an in-flight initial save assign its server id before deleting.
            clearTimeout(timer);
            while (saving) await delay(50);
            if (!draft.id.startsWith('local-')) await api(`/api/drafts/${encodeURIComponent(draft.id)}`, { method: 'DELETE' });
            drafts = drafts.filter(item => item !== draft);
            if (currentKey === draft.id) currentKey = null;
            renderDrafts();

        showVoiceNotice(framed ? `${engine.name} works when the page is open in its own tab.` : `${engine.name} is not supported in this browser.`, framed);
        return;
      }
      const session = ++voiceSession;
      voiceTarget = draft;
      setVoiceState('starting');
      renderCaption('', '', 'Starting microphone…');
      // The microphone first: a blocked or refused one should not cost a model download.
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        stream.getTracks().forEach(track => track.stop());
      } catch (error) {
        if (session !== voiceSession) return;
        const [text, offerTab] = micProblem(error);
        stopVoice(); showVoiceNotice(text, offerTab);
        return;
      }
      if (session !== voiceSession) return;
      try { localStorage.setItem(VOICE_USED_KEY, '1'); } catch (_) {}
      const loading = detail => `Loading ${engine.name}${detail ? ' ' + detail : ''}…`;
      try {
        const handle = await MoonshineStreaming.start({
          arch: engine.arch,
          onStatus: (status, detail) => { if (session === voiceSession && voiceState === 'starting') renderCaption('', '', loading(detail)); },
          onListening: () => { if (session === voiceSession) { setVoiceState('listening'); renderCaption('', '', 'Listening…'); } },
          onCaption: (stable, tentative) => {
            if (stable || tentative) renderCaption(stable, tentative);
            else if (session === voiceSession && voiceState === 'listening') renderCaption('', '', 'Listening…');
            else renderCaption('', '');
          },
          onTurn: text => insertDictation(text),
          onError: error => {
            if (session !== voiceSession) return;
            const [text, offerTab] = micProblem(error);
            stopVoice(); showVoiceNotice(text, offerTab);
          },
        });
        if (session !== voiceSession) { handle.stop(); return; }
        voiceHandle = handle;
      } catch (error) {
        if (session !== voiceSession) return;
        const [text, offerTab] = micProblem(error);
        stopVoice(); showVoiceNotice(text, offerTab);
      }
    }
    async function startVoice() {
      const draft = currentDraft();
      if (!draft || currentFired || voiceState !== 'idle') return;
      voiceNotice.hidden = true;
      if (!window.LocalVocal || !navigator.mediaDevices?.getUserMedia) {
        showVoiceNotice(window.isSecureContext ? 'Dictation is not available in this browser.' : 'Dictation needs a secure (https) address.', false);
        return;
      }
      if (microphoneAllowedHere() === false) {
        showVoiceNotice(framed ? 'The microphone is blocked inside this window.' : 'This page is not allowed to use the microphone.', framed);
        return;
      }
      const engine = currentEngine();
      if (engine.arch) return startStreamingVoice(draft, engine);
      const session = ++voiceSession;
      voiceTarget = draft;
      setVoiceState('starting');
      renderCaption('', '', 'Starting microphone…');
      // The microphone first: a blocked or refused one should not cost a model download.
      const warm = voiceWarm = LocalVocal.prewarmMic();
      const mic = await warm;
      if (session !== voiceSession) return;
      if (!mic) {
        const [text, offerTab] = micProblem(LocalVocal.lastError);
        stopVoice(); showVoiceNotice(text, offerTab);
        return;
      }
      try { localStorage.setItem(VOICE_USED_KEY, '1'); } catch (_) {}
      LocalVocal.init({ preferCpu, onStatus: (status, detail) => {
        if (session === voiceSession && voiceState === 'starting' && status === 'loading') renderCaption('', '', loadingLabel(detail));
      } });
      if (LocalVocal.status !== 'ready') renderCaption('', '', loadingLabel(LocalVocal.statusDetail));
      voiceHandle = LocalVocal.listen({
        onListening: () => {
          if (session !== voiceSession) return;
          setVoiceState('listening'); renderCaption('', '', 'Listening…');
        },
        onCaption: (stable, tentative) => {
          if (stable || tentative) renderCaption(stable, tentative);
          else if (session === voiceSession && voiceState === 'listening') renderCaption('', '', 'Listening…');
          else renderCaption('', '');
        },
        onTurn: text => insertDictation(text),
        onLevel: showLevel,
        onError: error => {
          if (session !== voiceSession) return;
          const message = (error && error.message) || '';
          if (message.startsWith('transcription') && voiceState === 'listening') return;   // one chunk lost; dictation continues
          const [text, offerTab] = message.startsWith('transcription')
            ? ['The voice model could not load. Check the connection and try again.', false] : micProblem(error);
          stopVoice(); showVoiceNotice(text, offerTab);
        },
      });
    }
    function stopVoice() {
      if (voiceState === 'idle') return;
      voiceSession++;
      setVoiceState('idle');
      if (voiceHandle) { voiceHandle.stop(); voiceHandle = null; }
      // Release the microphone now, and again if a request still in flight opens it later.
      LocalVocal.releaseMic();
      const warm = voiceWarm; voiceWarm = null;
      if (warm) warm.then(() => { if (voiceState === 'idle') LocalVocal.releaseMic(); });
      if (voiceCaption.querySelector('.voice-status')) renderCaption('', '');
    }
    // A tap toggles dictation; right-click or press-and-hold opens the model menu instead.
    let holdTimer = null, heldOpen = false;
    voiceButton.addEventListener('click', () => {
      if (heldOpen) { heldOpen = false; return; }
      closeVoiceMenu();
      if (voiceState === 'idle') startVoice(); else stopVoice();
    });
    voiceButton.addEventListener('contextmenu', event => {
      event.preventDefault();   // also keeps the workspace's own right-click menu away
      clearTimeout(holdTimer);
      if (event.pointerType === 'touch') heldOpen = true;
      openVoiceMenu();
    });
    voiceButton.addEventListener('pointerdown', event => {
      if (event.pointerType === 'mouse') return;
      heldOpen = false;
      clearTimeout(holdTimer);
      holdTimer = setTimeout(() => { heldOpen = true; openVoiceMenu(); }, 550);
    });
    for (const type of ['pointerup', 'pointercancel', 'pointerleave']) voiceButton.addEventListener(type, () => clearTimeout(holdTimer));
    document.getElementById('voice-notice-close').addEventListener('click', () => { voiceNotice.hidden = true; });
    try {
      // Someone who has dictated before gets the cached model loaded ahead of the next press.
      if (window.LocalVocal && !currentEngine().arch && localStorage.getItem(VOICE_USED_KEY)) setTimeout(() => LocalVocal.init({ preferCpu }), 1500);
    } catch (_) {}
    const initial = localDraft();
    drafts = [initial];
    displayDraft(initial);
    api('/api/drafts').then(data => {
      const stored = data.drafts.map(draft => ({ ...draft, dirty: false, version: 0 }));
      if (hasInteracted) { drafts = [...drafts, ...stored]; return; }
      drafts = stored.length ? stored : [initial];
      if (stored.length) displayDraft(stored[0]);
    }).catch(showSaveError);
    const defaultsFetch = api('/api/destination-defaults').then(data => {
      if (defaultsChanged) return;
      if (localDefaultsReady && (defaults.updated_at || 0) > (data.updated_at || 0)) { saveDefaults(); return; }
      const machineBefore = modelMachine();
      defaults = normalizeDefaults(data);
      activateMachine();
      try { localStorage.setItem(DEFAULTS_KEY, JSON.stringify(defaults)); } catch (_) {}
      // A new browser learns the usual machine only now; warm its models ahead of Continue.
      if (modelMachine() !== machineBefore) warmModels();
      if (activeView === 'setup') loadModels();
    }).catch(() => {});
    defaultsReady = localDefaultsReady ? Promise.resolve() : defaultsFetch;
    warmModels();
    setInterval(warmModels, 5 * 60 * 1000);

    // Each tab/installed copy compares against the version that rendered it,
    // never a freshly fetched baseline (which could miss an update while loading).
    const loadedFrontendVersion = '__FRONTEND_VERSION__';
    const updateNotice = document.getElementById('update-notice');
    const updateMessage = document.getElementById('update-message');
    const refreshAppButton = document.getElementById('refresh-app');
    let checkingUpdate = false;
    async function checkFrontendUpdate() {
      if (checkingUpdate || !updateNotice.hidden) return;
      checkingUpdate = true;
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 5000);
      try {
        const response = await fetch('/api/frontend-version', { cache: 'no-store', signal: controller.signal });
        if (!response.ok) return;
        const data = await response.json();
        if (typeof data.version === 'string' && /^[a-f0-9]{64}$/.test(data.version) && data.version !== loadedFrontendVersion) {
          updateNotice.hidden = false;
        }
      } catch (_) { /* Offline or restarting: keep writing and retry later. */ }
      finally { clearTimeout(timeout); checkingUpdate = false; }
    }
    refreshAppButton.addEventListener('click', async () => {
      if (voiceState !== 'idle') {
        updateMessage.textContent = 'Stop dictation, then click to refresh.';
        return;
      }
      refreshAppButton.disabled = true;
      updateMessage.textContent = 'Saving before refreshing…';
      try {
        // An autosave already in flight must finish before another can begin.
        const deadline = Date.now() + 10000;
        while (saving && Date.now() < deadline) await new Promise(resolve => setTimeout(resolve, 50));
        if (saving) throw new Error('Save still running');
        await saveDirty();
        await defaultsWrite;
        if (saving || drafts.some(draft => draft.dirty) || voiceState !== 'idle') throw new Error('Not ready to refresh');
        window.location.reload();
      } catch (_) {
        updateMessage.textContent = 'Could not refresh safely. Finish dictation or check your connection, then try again.';
        refreshAppButton.disabled = false;
      }
    });
    setInterval(checkFrontendUpdate, 10000);
    window.addEventListener('focus', checkFrontendUpdate);
    window.addEventListener('online', checkFrontendUpdate);
    window.addEventListener('pageshow', checkFrontendUpdate);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) checkFrontendUpdate(); });
    checkFrontendUpdate();
  </script>
  <!-- shell script -->
