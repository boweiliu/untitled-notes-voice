format = "v2"

[template]
slug = "untitled-notes-voice"
title = "Untitled Notes Voice"
description = "Draft messages with on-device voice dictation, then send them to chats across your Imbue Studio machines."
thumbnail = "template.svg"
version = "v1"

[recipe]
include = ["system/apps/untitled_notes_voice", "system/supervisord.conf.d/untitled-notes-voice.conf", "pyproject.toml", "system/supervisord.conf.d/host-backup.conf", "system/supervisord.conf.d/share-gateway.conf"]
data_include = []
exclude = ["system/apps/untitled_notes_voice/deploy", "data/", "Other custom apps and private sync settings", "External Git history, credentials, draft databases, recordings, runtime instance state, personal memory and transcripts"]
modification_rules = ["Stage a clean archive of the external app voice source under system/apps/untitled_notes_voice; this version is anchored to 16a40263d4f303b804e4d866a0600e26c4eddf21. Future updates must explicitly refresh this external source rather than assuming the monorepo contains it.", "Remove private deployment, scheduled update scripts and old deployment configuration; do not install an automatic updater.", "Install as a native uv workspace package; preserve full root metadata, add the local source mapping and regenerate uv.lock with uv sync --all-packages, register the native app.toml and run uv run --package untitled-notes-voice untitled-notes-voice from the workspace root on port 8096.", "Replace private deployment documentation with public installation and microphone requirements; describe browser-local audio and server-autosaved text accurately and preserve attribution and license notices.", "Remove only full comment lines containing non-runtime credential-file references from pristine host-backup.conf and share-gateway.conf to avoid the assembler comment-parser false positive; preserve every runtime field byte-for-byte.", "Add the public MIT license while preserving third-party notices. Give the existing UMD voice test modules a local CommonJS package boundary so the monorepo ESM default does not change their Node loading semantics. Isolate tests from inherited chat and gateway destinations using fake data and disconnected endpoints. Keep app behavior, voice engines, cross-machine sending and uncertain-delivery semantics unchanged; exclude all runtime and personal data."]

[requirements]

[[requirements.permission]]
scope = "minds-workspaces"
permission = "minds-workspaces-read"
note = "Optional linked-machine browsing. Use type=workspace, payload.permissions=[minds-workspaces-read], no target_workspace_id; agent_id is the current chat id and rationale explains browsing. Local-only use needs no grant."

[[requirements.permission]]
scope = "minds-workspaces"
permission = "minds-workspaces-ssh"
note = "Optional linked-destination chat access. Use type=workspace, payload.permissions=[minds-workspaces-ssh], target_workspace_id set to the destination agent id, current chat agent_id and a clear rationale."

[[requirements.adaptation]]
summary = "Browser dictation requires microphone access and downloaded models."
resolution = "Use a standalone HTTPS browser tab, grant the microphone and allow first-use downloads; v2 requires cross-origin isolation and Small may be slow on modest CPUs."

[[requirements.adaptation]]
summary = "Chat sending uses the adopter's Studio-connected AI account."
resolution = "Connect the desired provider in Studio on each chosen destination; no app-specific transcription secret or direct LLM integration is needed."

[[requirements.adaptation]]
summary = "An uncertain send does not prove that the initial prompt reached chat history."
resolution = "Inspect the destination before manually retrying; original text is preserved and the app never automatically retries uncertain sends."


[environment]
apt = ["openssh-client"]
env_d_units = []
